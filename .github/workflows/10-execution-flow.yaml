name: 10 - Execution Flow

on: 
    workflow_dispatch:
        inputs:
            pass-units-tests:
                type: boolean
                default: true

jobs:
    lint-build: 
        runs-on: ubuntu-latest
        steps:
            - name: Lint and Build
              run: echo "Linting and building project"
    unit-tests: 
        continue-on-error: true
        runs-on: ubuntu-latest
        steps:
            - name: Running unit tests
              run: echo "Running tests...."
            - name: Failing tests
              if: ${{ !inputs.pass-units-tests }}
              run: exit 1
    deploy-non-prod: 
        runs-on: ubuntu-latest
        needs: 
            - lint-build
            - unit-tests
        steps:
            - name: Deploying to nonprod
              run: echo "Deploying to nonprod"
    e2e-tests: 
        runs-on: ubuntu-latest
        needs: 
            - deploy-non-prod
        steps:
            - name: Running E2E test
              run: echo "Running E2E test"
    load-tests: 
        runs-on: ubuntu-latest
        needs: 
            - deploy-non-prod
        steps:
            - name: Running Load test
              run: echo "Running Load test"
    deploy-prod: 
        runs-on: ubuntu-latest
        needs: 
            - e2e-tests
            - load-tests
        steps:
            - name: Deploying to prod
              run: echo "Deploying to prod"