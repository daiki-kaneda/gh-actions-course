name: 18.1 - Reusable Workflow | Reusable Defenition

on:
    workflow_call:
        inputs:
            target-directory:
                type: string
                required: true
        outputs:
            build-status:
                description: The status of build process
                value: ${{jobs.deploy.outputs.status}}
            url:
                description: The url of deployed version
                value: ${{jobs.deploy.outputs.url}}


jobs:
    deploy:
        runs-on: ubuntu-latest
        outputs:
            status: ${{steps.build.outputs.build_status}}
            url: ${{steps.deploy.outputs.url}}
        steps: 
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Build
              id: build
              run: |
                echo "Building using directory ${{inputs.target-directory}}......"
                echo "build_status=success" >> "$GITHUB_OUTPUT"
            - name: Deploy
              id: deploy
              run: |
                echo "Deploying build artifacts"
                echo "url=https://www.google.com" >> "$GITHUB_OUTPUT"
            