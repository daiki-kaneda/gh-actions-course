name: 15 - Working With Matrices

on: workflow_dispatch

jobs:
    backwards-compatibility:
        name: ${{matrix.os}}-${{matrix.node-version}}
        strategy:
            fail-fast: true
            matrix:
                node-version: [22.x,24.x]
                os:
                    - ubuntu-latest
                    - windows-latest
                include:
                    - node-version: 26.x
                      os: ubuntu-latest
                      tag: experimental      
        runs-on: ${{matrix.os}}
        steps: 
            - name: Setup node
              uses: actions/setup-node@v6
              with:
                node-version: ${{matrix.node-version}}
            - name: Fail if experimental
              if: matrix.tag == 'experimental'
              run: exit 1
            - name: Perform some tests
              run: |
                echo "Running tests on OS ${{matrix.os}} and NodeJS ${{matrix.node-version}}"
                sleep 10
            - name: Uploading test result
              run: echo "Uploading test result"
    include-example: 
        name: ${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}-${{matrix.opacity}}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                color: [red,green]
                shape: [circle,square]
                size: [small,large]
                include:
                    - color: red
                      opacity: 75
                    - shape: circle
                      opacity: 100
                    - color: red
                      shape: triangle
                    - opacity: 50
                    - clolor: green
                      shape: circle
                      size: medium
                exclude:
                    - color: green
                      shape: circle

        steps:
            - name: Dummy Step
              run: echo "This is ${{matrix.color}}-${{matrix.shape}}-${{matrix.size}}-${{matrix.opacity}}"
            