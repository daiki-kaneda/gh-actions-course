name: 08 - Using Varaibles

on: 
    workflow_dispatch:
env: 
    WORKFLOW_VAR: "I am a workflow env var"
    OVERWRITTEN: "I am overwritten"
    UNDEFINED_VAR_WITH_DEFAULT: ${{vars.UNDEFINED_VAR || 'default value'}}

jobs: 
    echo:
        runs-on: ubuntu-latest
        env:
            JOB_VAR: "I am a job env var"
            OVERWRITTEN: "I am overwritten at job level"
        steps:
            - name: Print Env Variables
              env: 
                STEP_VAR: "I am step env var"
                step_var2: "I am another step env var"
              run: |
                echo "Step env var: ${{env.STEP_VAR}}"
                echo "Step env var2: $step_var2"
                echo "Job env var: ${{env.JOB_VAR}}"
                echo "Workflow env var: ${{env.WORKFLOW_VAR}}"
                echo "Overwritten: ${{env.OVERWRITTEN}}"
            - name: Overwrite Job Varibale
              env: 
                OVERWRITTEN: "I am overwritten at step level"
              run: |
                echo "Overwritten: ${{env.OVERWRITTEN}}"
    echo2:
        runs-on: ubuntu-latest
        steps:
            - name: Print Variables
              env: 
                STEP_VAR: "I am step env var"
                step_var2: "I am another step env var"
              run: |
                echo "Repo var: ${{vars.REPOSITORY_VAR}}"
    echo-prod:
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - name: Print Variables
              run: |
                echo "Environment var: ${{vars.TARGET_VAR}}"
    echo-undefined:
        runs-on: ubuntu-latest
        steps:
            - name: Print Undefined Var
              run: |
                echo "Org var: ${{env.UNDEFINED_VAR_WITH_DEFAULT}}"
            